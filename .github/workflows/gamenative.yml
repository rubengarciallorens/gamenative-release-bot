name: GameNative Release Watch

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get latest GameNative release
        id: release
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/utkarshdalal/GameNative/releases/latest)

          TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          URL=$(echo "$RESPONSE" | jq -r '.html_url')
          BODY=$(echo "$RESPONSE" | jq -r '.body // "Sin notas de versión."')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compare with previous release
        id: compare
        shell: bash
        run: |
          CURRENT="${{ steps.release.outputs.tag }}"

          if [ ! -f last_version.txt ]; then
            echo "status=init" >> "$GITHUB_OUTPUT"
            echo "Primera ejecución: $CURRENT"

          else
            LAST=$(cat last_version.txt)

            if [ "$CURRENT" = "$LAST" ]; then
              echo "status=same" >> "$GITHUB_OUTPUT"
              echo "Sin cambios: $CURRENT"
            else
              echo "status=changed" >> "$GITHUB_OUTPUT"
              echo "Nueva versión: $LAST -> $CURRENT"
            fi
          fi

      - name: Send Telegram notification
        if: steps.compare.outputs.status == 'changed'
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          NOTES="${RELEASE_BODY:0:2500}"

          MESSAGE=$(printf \
          '🎮 NUEVA VERSIÓN DE GAMENATIVE

          🚀 %s

          📋 Cambios:
          %s

          🔗 Release:
          %s' \
          "$TAG" "$NOTES" "$RELEASE_URL")

          curl -fsS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=false"

      - name: Save current release
        if: |
          steps.compare.outputs.status == 'init' ||
          steps.compare.outputs.status == 'changed'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "$TAG" > last_version.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_version.txt
          git commit -m "Update GameNative release to $TAG"
          git push
